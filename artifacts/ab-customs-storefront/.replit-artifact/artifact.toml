kind = "web"
previewPath = "/"
title = "AB Customs Storefront"
description = "A premium automotive aftermarket ecommerce storefront for AB Customs, with vehicle-aware browsing, product discovery, build customization, cart, wishlist, and responsive mobile-first shopping flows."
version = "1.0.0"
id = "artifacts/ab-customs-storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21044

[services.development]
run = "pnpm --filter @workspace/ab-customs-storefront run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ab-customs-storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/ab-customs-storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21044"
BASE_PATH = "/"
